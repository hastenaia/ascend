name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc --noEmit
      - run: npm test

  # Optional: trigger Vercel deploy explicitly if Git integration is paused.
  # This is a no-op when Vercel's GitHub App auto-deploys (default).
  # To enable, set secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in GitHub.
  vercel-fallback:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_VERCEL_FALLBACK == 'true'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
